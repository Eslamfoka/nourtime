# Unit tests, lint and a debug build on every push and pull request; instrumented tests on an emulator; the Firestore rules and push functions tests too.
# Debug builds use the committed demo Firebase config (app/src/debug/google-services.json), so no
# secrets are needed. The release build needs the real config and the upload key, kept off GitHub.
name: Android

on:
  push:
  pull_request:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests, lint, debug build
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  # The Firestore security rules (parent/child isolation, pairing) against the local emulators.
  firestore-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: firebase
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: firebase/package-lock.json

      # The Firestore emulator in firebase-tools 15 needs Java 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install
        run: npm ci

      - name: Rules tests
        run: npm test

      # Push functions: the pure logic, a type-checked build, then sending against the Firestore emulator.
      - name: Functions tests
        run: |
          npm --prefix functions ci
          npm --prefix functions test
          npm --prefix functions run build
          npm run test:functions

  # Instrumented tests (app/src/androidTest: TimerService, BlockCoordinator) on an emulator. Locally they
  # run on API 36 (AVD nourdm-test-api36); here on API 34, so two Android versions are covered.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Hardware acceleration for the emulator on GitHub's Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./gradlew --no-daemon connectedDebugAndroidTest

      - name: Instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-reports
          path: app/build/reports/androidTests/
          if-no-files-found: ignore
