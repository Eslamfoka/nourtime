<!doctype html>
<!-- Play feature graphic (1024x500). Render: tools/store/render-feature-graphic.sh -->
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: Cairo; src: url(../../app/src/main/res/font/cairo_variable.ttf); font-weight: 200 1000; }
@font-face { font-family: Nunito; src: url(../../app/src/main/res/font/nunito_variable.ttf); font-weight: 200 1000; }
html, body { margin: 0; width: 1024px; height: 500px; overflow: hidden; }
body {
  background: radial-gradient(circle at 26% 50%, #2E3F6B 0%, #1E2A4A 45%, #141C33 100%);
  display: flex; align-items: center; color: #FFF8EC; position: relative;
}
.dot { position: absolute; border-radius: 50%; background: #FFF8EC; opacity: .55; }
.art { width: 400px; display: flex; justify-content: center; }
.art svg { width: 300px; height: 300px; filter: drop-shadow(0 0 36px rgba(255,200,87,.55)); }
.text { flex: 1; padding-right: 64px; text-align: center; }
.ar { font-family: Cairo; font-weight: 800; font-size: 92px; line-height: 1.1; direction: rtl; }
.en { font-family: Nunito; font-weight: 800; font-size: 64px; line-height: 1.1; color: #FFC857; }
.tag { font-family: Nunito; font-weight: 600; font-size: 28px; margin-top: 18px; opacity: .9; }
.tag-ar { font-family: Cairo; font-weight: 600; font-size: 28px; direction: rtl; opacity: .9; }
</style></head>
